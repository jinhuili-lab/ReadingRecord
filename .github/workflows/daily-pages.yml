name: Daily ReadingRecord Pages build

# GitHub-native replacement for the external (local machine) dispatcher.
# GitHub Actions cron is UTC-only, so we schedule both UTC slots that can be
# 18:00 in Chicago and let a gate job keep only the one that really is 18:00
# local time (handles CDT/CST automatically).

on:
  schedule:
    - cron: '0 23 * * *'   # 18:00 CDT (Mar-Nov)
    - cron: '0 0 * * *'    # 18:00 CST (Nov-Mar)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          TZ: America/Chicago
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date +%H)" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: jinhuili-lab/ReadingRecord/.github/workflows/deploy-pages.yml@pages
