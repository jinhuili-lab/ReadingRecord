name: Daily ReadingRecord Pages build

# Daily rebuild of the Notion content into GitHub Pages.
#
# NOTE: there used to be a "gate" job that dropped one of the two UTC slots so
# only the run that really landed at 18:00 Chicago time would deploy. GitHub's
# scheduled-workflow queue can be delayed by hours, so that gate almost always
# evaluated to false and Pages went stale (last deploy 2026-10-30). The gate is
# gone: both slots deploy, and peaceiris/actions-gh-pages only commits when the
# exported output actually changed.

on:
  schedule:
    - cron: '0 23 * * *'   # 18:00 CDT / 17:00 CST
    - cron: '0 0 * * *'    # 19:00 CDT / 18:00 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: jinhuili-lab/ReadingRecord/.github/workflows/deploy-pages.yml@pages
